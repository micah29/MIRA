# MIRA production stack
#   docker compose -f docker-compose.prod.yml up -d --build
# Database: external PostgreSQL server (not run in Docker). DATABASE_URL is set in .env.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      UPLOAD_DIR: uploads
    volumes:
      - mira_uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${MIRA_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  mira_uploads:
