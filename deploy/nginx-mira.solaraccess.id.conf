# Host Nginx (the one already serving VIRA): /etc/nginx/sites-available/mira.solaraccess.id
# Enable:  sudo ln -s /etc/nginx/sites-available/mira.solaraccess.id /etc/nginx/sites-enabled/
# Check:   sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d mira.solaraccess.id
server {
  listen 80;
  server_name mira.solaraccess.id;
  client_max_body_size 12m;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
