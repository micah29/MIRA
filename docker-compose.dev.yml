# Local PostgreSQL for development: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elina
      POSTGRES_PASSWORD: elina
      POSTGRES_DB: elina_db
    ports: ["5434:5432"]
    volumes: [elina_pg:/var/lib/postgresql/data]
volumes:
  elina_pg:
